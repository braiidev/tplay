[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tplay"
# La versión la lee player/__init__.py:__version__ (entry point tplay).
# Antes no había bloque [project] en absoluto: el repo no era instalable con pip,
# por eso install.sh usaba `pip install --user -r requirements.txt` y nada más.
version = "0.16.0"
description = "Reproductor de música TUI en curses: biblioteca local, YouTube y radio, con ecualizador y tema configurable."
# Rango, no versión exacta: el pin real lo persiste install.sh en .pinned-python.
# El SO puede subir a 3.14 sin romper la instalación.
requires-python = ">=3.10,<3.15"
# Techos en las tres. yt-dlp se deja sin techo porque se rompe seguido (403 de
# YouTube) y player/ytdlp_update.py ya lo actualiza contra PyPI cada 24h con
# cache en disco; un techo lo dejaría clavado en una versión que deja de servir.
dependencies = [
    # Las tres con techo, pero yt-dlp necesita un techo unusual.
    #
    # python-vlc y mutagen están API-estables: 3.x y 1.x. Con <4 y <2 alcanza.
    #
    # yt-dlp sube por fecha (YYYY.MM.DD), así que "mayor versión" no significa
    # "API incompatible": no usa semver. Un techo de 4ta mayor lo dejaría
    # instalar sin cambios durante meses y después fallaría de golpe en cada
    # instalación, sin aviso. Por eso el techo es de AÑO: <2027.0.0 acota el
    # salto mayor anual (cuando yt-dlp cambia la API del extractor y sí hay que
    # revisarlo) pero deja que las correcciones mensuales fluyan.
    #
    # Además hay un auto-actualizador diario (player/ytdlp_update.py) contra
    # PyPI, así que el techo no frena las correcciones: las pide en caliente.
    "python-vlc>=3.0.0,<4.0.0",
    "mutagen>=1.46.0,<2.0.0",
    "yt-dlp>=2026.07.04,<2027.0.0",
]

[project.scripts]
tplay = "player:main"

[tool.setuptools.packages.find]
# El paquete vive en la raíz del repo, no en src/ como Clock y MonitorPC.
where = ["."]
include = ["player*"]

[tool.mypy]
strict = true
python_version = "3.12"
exclude = [".venv", "build", "dist"]
ignore_missing_imports = true

[tool.black]
line-length = 88
target-version = ["py310"]
